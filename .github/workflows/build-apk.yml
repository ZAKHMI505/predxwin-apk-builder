name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build id (used as release tag)"
        required: true
      app_name:
        description: "App name"
        required: true
      app_url:
        description: "Website URL"
        required: true
      app_version:
        description: "Version name"
        required: false
        default: "1.0.0"
      app_id:
        description: "Android application id"
        required: false
        default: "com.predxwin.webapp"
      icon_b64:
        description: "Base64 PNG app icon"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore or create signing keystore
        run: |
          set -e
          if [ -f keystore.b64 ]; then
            base64 -d keystore.b64 > keystore.jks
          else
            keytool -genkeypair -v -keystore keystore.jks -alias predxwin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass predxwin2026 -keypass predxwin2026 \
              -dname "CN=PREDXWIN, OU=Apps, O=PREDXWIN, L=NA, S=NA, C=PK"
            base64 -w0 keystore.jks > keystore.b64
            git config user.name "predxwin-builder"
            git config user.email "builder@users.noreply.github.com"
            git add keystore.b64
            git commit -m "Add signing keystore"
            git push
          fi

      - name: Apply custom icon
        if: ${{ github.event.inputs.icon_b64 != '' }}
        run: |
          set -e
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo "${{ github.event.inputs.icon_b64 }}" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          gradle --no-daemon assembleRelease \
            -PAPP_NAME="${{ github.event.inputs.app_name }}" \
            -PAPP_URL="${{ github.event.inputs.app_url }}" \
            -PAPP_VERSION="${{ github.event.inputs.app_version }}" \
            -PAPP_ID="${{ github.event.inputs.app_id }}" \
            -PAPP_VERSION_CODE="${{ github.run_number }}"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/${{ github.event.inputs.build_id }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.build_id }}
          name: ${{ github.event.inputs.app_name }} ${{ github.event.inputs.app_version }}
          files: out/${{ github.event.inputs.build_id }}.apk
